<script>
window.initializeThreePhaseRotor = function () {

    const fields = [
        "M",
        "rng_wt",
        "rng_ht",
        "X",
        "V",
        "V2",
        "A2",
        "ra",
        "rb",
        "rc",
        "rd",
        "re",
        "rw",
        "shaft_diameter"
    ];


    /*
     * Restore values from the current design.
     *
     * sessionStorage is used instead of localStorage
     * so the values belong to the current design workflow.
     */

    fields.forEach((field) => {

        const input =
            document.getElementById(field);

        if (!input) {
            return;
        }

        const saved =
            sessionStorage.getItem(field);

        if (saved !== null) {
            input.value = saved;
        }
    });


    /*
     * Save values whenever the user changes them.
     *
     * The existing engineering calculation code
     * uses these exact keys.
     */

    fields.forEach((field) => {

        const input =
            document.getElementById(field);

        if (!input) {
            return;
        }

        input.addEventListener(
            "input",
            () => {

                sessionStorage.setItem(
                    field,
                    input.value
                );

            }
        );

    });


    /*
     * Prevent mouse-wheel modification of number fields.
     */

    if (!window.motoMasterNumberWheelHandler) {

        window.motoMasterNumberWheelHandler =
            function (event) {

                if (
                    document.activeElement &&
                    document.activeElement.type === "number"
                ) {
                    document.activeElement.blur();
                }

            };

        document.addEventListener(
            "wheel",
            window.motoMasterNumberWheelHandler,
            {
                passive: true
            }
        );
    }

};
</script>
