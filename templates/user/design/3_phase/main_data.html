<div class="design-parameter-form">

<div class="design-form-grid">

    <!-- =========================
         DESIGN NO
    ========================== -->

    <div class="design-input-group">
        <label for="designNo">Design No</label>
        <input
            type="text"
            id="designNo"
            name="designNo"
            required
        >
    </div>


    <!-- =========================
         DESIGN NAME
    ========================== -->

    <div class="design-input-group">
        <label for="designName">Design Name</label>
        <input
            type="text"
            id="designName"
            name="designName"
            required
        >
    </div>


    <!-- =========================
         DATE
    ========================== -->

    <div class="design-input-group">
        <label for="designDate">Date</label>
        <input
            type="date"
            id="designDate"
            name="designDate"
            required
        >
    </div>


    <!-- =========================
         VOLTAGE
    ========================== -->

    <div class="design-input-group">
        <label for="voltage">Voltage (V)</label>
        <input
            type="number"
            id="voltage"
            name="voltage"
            min="0"
            step="any"
            required
        >
    </div>


    <!-- =========================
         POWER
    ========================== -->

    <div class="design-input-group">
        <label for="power">Power (Watts)</label>
        <input
            type="number"
            id="power"
            name="power"
            min="0"
            step="any"
            required
        >
    </div>


    <!-- =========================
         HORSE POWER
    ========================== -->

    <div class="design-input-group">
        <label for="hp">Horse Power (HP)</label>
        <input
            type="number"
            id="hp"
            name="hp"
            min="0"
            step="0.01"
        >
    </div>


    <!-- =========================
         FREQUENCY
    ========================== -->

    <div class="design-input-group">
        <label for="frequency">Frequency (Hz)</label>
        <select
            id="frequency"
            name="frequency"
            required
        >
            <option value="">-- Select --</option>
            <option value="50">50 Hz</option>
            <option value="60">60 Hz</option>
        </select>
    </div>


    <!-- =========================
         CONNECTION
    ========================== -->

    <div class="design-input-group">
        <label for="connection">Connection</label>
        <select
            id="connection"
            name="connection"
            required
        >
            <option value="">-- Select --</option>
            <option value="Star">Star</option>
            <option value="Delta">Delta</option>
            <option value="Series">Series</option>
            <option value="Parallel">Parallel</option>
        </select>
    </div>


    <!-- =========================
         RPM
    ========================== -->

    <div class="design-input-group">
        <label for="rpm">RPM</label>
        <input
            type="number"
            id="rpm"
            name="rpm"
            min="0"
            step="1"
            required
        >
    </div>


    <!-- =========================
         POLE
    ========================== -->

    <div class="design-input-group">
        <label for="pole">Pole</label>
        <select
            id="pole"
            name="pole"
            required
        >
            <option value="">-- Select --</option>
            <option value="2">2 Pole</option>
            <option value="4">4 Pole</option>
            <option value="6">6 Pole</option>
            <option value="8">8 Pole</option>
            <option value="10">10 Pole</option>
            <option value="12">12 Pole</option>
        </select>
    </div>


    <!-- =========================
         UPH
    ========================== -->

    <div class="design-input-group">
        <label for="uph">UPH (Unit Per Hour)</label>
        <input
            type="text"
            id="uph"
            name="uph"
            required
        >
    </div>

</div>


<div class="design-action">
    <button type="button" class="design-next-button" id="mainDataNext">
        Continue
    </button>
</div>

</div>


<!-- =========================
     CALCULATION LOGIC
========================== -->

<script>
(function () {

    /* =========================
       ELEMENTS
       IDs match design.js exactly:
       designNo, designName, designDate,
       connection, voltage, power, hp,
       frequency, rpm, pole, uph
    ========================== */

    var elDesignNo   = document.getElementById("designNo");
    var elDesignName = document.getElementById("designName");
    var elDesignDate = document.getElementById("designDate");
    var elVoltage    = document.getElementById("voltage");
    var elPower      = document.getElementById("power");
    var elHp         = document.getElementById("hp");
    var elFrequency  = document.getElementById("frequency");
    var elConnection = document.getElementById("connection");
    var elRpm        = document.getElementById("rpm");
    var elPole       = document.getElementById("pole");
    var elUph        = document.getElementById("uph");


    /* =========================
       GUARD — abort if any
       element is missing
    ========================== */

    if (
        !elDesignNo   ||
        !elDesignName ||
        !elDesignDate ||
        !elVoltage    ||
        !elPower      ||
        !elHp         ||
        !elFrequency  ||
        !elConnection ||
        !elRpm        ||
        !elPole       ||
        !elUph
    ) {
        return;
    }


    /* =========================
       FIELD MAP
       key   = sessionStorage key
             = same ID design.js uses
             in saveMainData() and
             getValue() / getNumber()
       value = DOM element
    ========================== */

    var fields = [
        { key: "designNo",   el: elDesignNo   },
        { key: "designName", el: elDesignName },
        { key: "designDate", el: elDesignDate },
        { key: "voltage",    el: elVoltage    },
        { key: "power",      el: elPower      },
        { key: "hp",         el: elHp         },
        { key: "frequency",  el: elFrequency  },
        { key: "connection", el: elConnection },
        { key: "rpm",        el: elRpm        },
        { key: "pole",       el: elPole       },
        { key: "uph",        el: elUph        }
    ];


    /* =========================
       RESTORE FROM SESSION
       Runs on every load so
       values survive Back/Next
    ========================== */

    fields.forEach(function (f) {

        var stored =
            sessionStorage.getItem(f.key);

        if (stored !== null && stored !== "") {
            f.el.value = stored;
        }

    });


    /* =========================
       SAVE TO SESSION
       Saves under the same keys
       design.js reads back via
       getValue() / getNumber()
    ========================== */

    function save() {

        fields.forEach(function (f) {
            sessionStorage.setItem(
                f.key,
                f.el.value
            );
        });

    }


    /* =========================
       CALCULATE
       Power → HP  (HP = W / 746)
       3-phase: no capacitor field
    ========================== */

    function calculate() {

        var power =
            parseFloat(elPower.value);

        if (!isNaN(power)) {

            elHp.value =
                (power / 746).toFixed(2);

        } else {

            elHp.value = "";

        }

    }


    /* =========================
       VOLTAGE ↔ UPH SYNC
    ========================== */

    elVoltage.addEventListener(
        "input",
        function () {
            elUph.value = elVoltage.value;
            save();
        }
    );

    elUph.addEventListener(
        "input",
        function () {
            elVoltage.value = elUph.value;
            save();
        }
    );


    /* =========================
       POWER — calculate + save
    ========================== */

    elPower.addEventListener(
        "input",
        function () {
            calculate();
            save();
        }
    );


    /* =========================
       ALL OTHER FIELDS — save
    ========================== */

    [
        elDesignNo,
        elDesignName,
        elDesignDate,
        elHp,
        elFrequency,
        elConnection,
        elRpm,
        elPole
    ].forEach(function (el) {
        el.addEventListener("input",  save);
        el.addEventListener("change", save);
    });


    /* =========================
       PREVENT NUMBER SCROLL
       Guard so the listener is
       only added once even if
       the form reloads
    ========================== */

    if (!window._motoWheelBound) {

        window._motoWheelBound = true;

        document.addEventListener(
            "wheel",
            function () {
                if (
                    document.activeElement &&
                    document.activeElement.type ===
                    "number"
                ) {
                    document.activeElement.blur();
                }
            },
            { passive: true }
        );

    }


    /* =========================
       INITIAL RUN
    ========================== */

    calculate();
    save();

}());
</script>
