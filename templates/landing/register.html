
<!-- =========================================================
     REGISTER MODAL
========================================================= -->

<div
    id="registerModal"
    class="auth-modal"
    aria-hidden="true"
>

    <div class="auth-modal-card">

        <button
            type="button"
            class="auth-close"
            id="closeRegister"
            aria-label="Close registration"
        >
            &times;
        </button>


        <div class="auth-brand">

            <div class="brand-mark">
                <span>M</span>
            </div>

            <h2>
                Moto <strong>Master</strong>
            </h2>

        </div>


        <h3>Create Account</h3>

        <p class="auth-subtitle">
            Create your Moto Master account.
        </p>


        <form id="registerForm">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="registerPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="registerPassword"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirm_password"
                    placeholder="Confirm your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Create Account
            </button>

        </form>


        <p class="auth-switch">

            Already have an account?

            <a
                href="#"
                id="showLogin"
            >
                Login
            </a>

        </p>

    </div>

</div>
