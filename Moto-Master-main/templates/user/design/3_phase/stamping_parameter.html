<div class="design-parameter-form">

<div class="design-form-grid">

    <div class="design-input-group">
        <label for="material">Rotor Material</label>
        <select id="material" name="material" required>
            <option value="">-- Select Material --</option>
            <option value="copper">Copper</option>
            <option value="aluminium">Aluminium</option>
        </select>
    </div>

    <div class="design-input-group">
        <label for="stamping_material">Stamping Material</label>
        <select
            id="stamping_material"
            name="stamping_material"
            required
        >
            <option value="">-- Select Material --</option>
            <option value="CRC">CRC</option>
            <option value="M-47">M-47</option>
            <option value="CRNO">CRNO</option>
        </select>
    </div>

    <div class="design-input-group">
        <label for="N">N</label>
        <input
            type="number"
            id="N"
            name="N"
            min="0"
            step="1"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="Y">Y (mm)</label>
        <input
            type="number"
            id="Y"
            name="Y"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="W">W (mm)</label>
        <input
            type="number"
            id="W"
            name="W"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="W2">W" (mm)</label>
        <input
            type="number"
            id="W2"
            name="W2"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="A1">A1 (sqmm)</label>
        <input
            type="number"
            id="A1"
            name="A1"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="shape">Shape</label>
        <select
            id="shape"
            name="shape"
            required
        >
            <option value="">-- Select Shape --</option>
            <option value="Round">Round</option>
            <option value="Trp">Trp</option>
        </select>
    </div>

    <div class="design-input-group">
        <label for="a">a (mm)</label>
        <input
            type="number"
            id="a"
            name="a"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="b">b (mm)</label>
        <input
            type="number"
            id="b"
            name="b"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="c">c (mm)</label>
        <input
            type="number"
            id="c"
            name="c"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="d">d (mm)</label>
        <input
            type="number"
            id="d"
            name="d"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="e">e (mm)</label>
        <input
            type="number"
            id="e"
            name="e"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="dw">dw (mm)</label>
        <input
            type="number"
            id="dw"
            name="dw"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="d0">d0 (mm)</label>
        <input
            type="number"
            id="d0"
            name="d0"
            step="0.01"
            required
        >
    </div>

    <div class="design-input-group">
        <label for="dia">Dia (mm)</label>
        <input
            type="number"
            id="dia"
            name="dia"
            step="0.01"
            required
        >
    </div>

</div>

<div class="design-action">
    <button type="button" class="design-back-button" id="stampingBack">
        Back
    </button>
    <button type="button" class="design-next-button" id="stampingNext">
        Continue
    </button>
</div>

</div>

<script>
window.initializeThreePhaseStamping = function () {

    const fields = [
        "material",
        "stamping_material",
        "N",
        "Y",
        "W",
        "W2",
        "A1",
        "shape",
        "a",
        "b",
        "c",
        "d",
        "e",
        "dw",
        "d0",
        "dia"
    ];


    /*
     * Restore values from the current design.
     */

    fields.forEach((field) => {

        const input =
            document.getElementById(field);

        if (!input) {
            return;
        }

        const saved =
            sessionStorage.getItem(field);

        if (saved !== null) {
            input.value = saved;
        }

    });


    /*
     * Material loss factors.
     *
     * Existing engineering values:
     *
     * CRC  -> lf_y = 22, lf_t = 22
     * CRNO -> lf_y = 8,  lf_t = 8
     * M-47 -> lf_y = 2,  lf_t = 2
     */

    function updateMaterialLossFactors(material) {

        let lf_y = 0;
        let lf_t = 0;

        switch (material) {

            case "CRC":
                lf_y = 22;
                lf_t = 22;
                break;

            case "CRNO":
                lf_y = 8;
                lf_t = 8;
                break;

            case "M-47":
                lf_y = 2;
                lf_t = 2;
                break;

        }

        sessionStorage.setItem(
            "lf_y",
            lf_y
        );

        sessionStorage.setItem(
            "lf_t",
            lf_t
        );

    }


    /*
     * Save all stamping values.
     */

    fields.forEach((field) => {

        const input =
            document.getElementById(field);

        if (!input) {
            return;
        }

        const eventType =
            input.tagName === "SELECT"
                ? "change"
                : "input";

        input.addEventListener(
            eventType,
            () => {

                sessionStorage.setItem(
                    field,
                    input.value
                );


                /*
                 * Update loss factors whenever
                 * stamping material changes.
                 */

                if (
                    field === "stamping_material"
                ) {
                    updateMaterialLossFactors(
                        input.value
                    );
                }

            }
        );

    });


    /*
     * Restore material loss factors for an
     * already-selected stamping material.
     */

    const stampingMaterial =
        document.getElementById(
            "stamping_material"
        );

    if (
        stampingMaterial &&
        stampingMaterial.value
    ) {

        updateMaterialLossFactors(
            stampingMaterial.value
        );

    }


    /*
     * Prevent mouse-wheel changes on number inputs.
     */

    if (!window.motoMasterNumberWheelHandler) {

        window.motoMasterNumberWheelHandler =
            function (event) {

                if (
                    document.activeElement &&
                    document.activeElement.type === "number"
                ) {
                    document.activeElement.blur();
                }

            };

        document.addEventListener(
            "wheel",
            window.motoMasterNumberWheelHandler,
            {
                passive: true
            }
        );
    }

};
</script>
