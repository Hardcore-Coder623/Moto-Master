    </div>


    <div class="design-input-group">
        <label for="rng_ht">
            End Ring Height
        </label>

        <input
            type="number"
            id="rng_ht"

    <div class="design-input-group">

    <div class="design-input-group">

    </div>


    <div class="design-input-group">
        <label for="A2">
            A2 (sqmm)
        </label>

        <input
            type="number"
            id="A2"
            name="A2"
            step="0.01"
            required
        >
    </div>


    <div class="design-input-group">
        <label for="ra">
            a (mm)
        </label>

        <input
            type="number"
            id="ra"
            name="ra"
            step="0.01"
            required
        >
    </div>


    <div class="design-input-group">
        <label for="rb">
            b (mm)
        </label>

        <input
            type="number"
            id="rb"

            step="0.01"

    <div class="design-input-group">

    <div class="design-input-group">

    <div class="design-input-group">

</div>

<div class="design-action">
    <button type="button" class="design-back-button" id="rotorBack">
        Back
    </button>
    <button type="button" class="design-next-button" id="rotorNext">
        Continue
    </button>
</div>

</div>

<script>

(function () {

    const rotorFields = [
        "M",
        "rng_wt",
        "rng_ht",
        "X",
        "V",
        "V2",
        "A2",
        "ra",
        "rb",
        "rc",
        "rd",
        "re",
        "rw",
        "shaft_diameter"
    ];


    /*
     * Save rotor values temporarily for the
     * current design workflow.
     */

    function saveRotorData() {

        const rotorData = {};

        rotorFields.forEach((fieldName) => {

            const field =
                document.getElementById(fieldName);

            if (field) {

                rotorData[fieldName] =
                    field.value;

            }

        });


        sessionStorage.setItem(
            "design_rotor_data",
            JSON.stringify(rotorData)
        );

    }


    /*
     * Restore previously entered values when
     * returning to the Rotor Parameters step.
     */

    function loadRotorData() {

        const savedData =
            sessionStorage.getItem(
                "design_rotor_data"
            );

        if (!savedData) {
            return;
        }


        try {

            const rotorData =
                JSON.parse(savedData);


            rotorFields.forEach((fieldName) => {

                const field =
                    document.getElementById(
                        fieldName
                    );

                if (
                    field &&
                    rotorData[fieldName] !== undefined
                ) {

                    field.value =
                        rotorData[fieldName];

                }

            });

        }
        catch (error) {

            console.error(
                "Unable to load rotor data:",
                error
            );

        }

    }


    rotorFields.forEach((fieldName) => {

        const field =
            document.getElementById(
                fieldName
            );


        if (field) {

            field.addEventListener(
                "input",
                saveRotorData
            );

        }

    });


    loadRotorData();


    /*
     * Prevent number-input scrolling.
     */

    document.addEventListener(
        "wheel",
        (event) => {

            if (
                document.activeElement &&
                document.activeElement.type ===
                "number"
            ) {

                document.activeElement.blur();

            }

        },
        {
            passive: true
        }
    );

})();

</script>
