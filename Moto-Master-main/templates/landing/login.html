
<!-- =========================================================
     LOGIN MODAL
========================================================= -->

<div
    id="loginModal"
    class="auth-modal"
    aria-hidden="true"
>

    <div class="auth-modal-card">

        <button
            type="button"
            class="auth-close"
            id="closeLogin"
            aria-label="Close login"
        >
            &times;
        </button>


        <div class="auth-brand">

            <div class="brand-mark">
                <span>M</span>
            </div>

            <h2>
                Moto <strong>Master</strong>
            </h2>

        </div>


        <h3>Welcome Back</h3>

        <p class="auth-subtitle">
            Login to your Moto Master account.
        </p>


        <form id="loginForm">

            <div class="form-group">

                <label for="login">
                    Username or Email
                </label>

                <input
                    type="text"
                    id="login"
                    name="login"
                    placeholder="Enter username or email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
            >
                Login
            </button>

        </form>


        <p class="auth-switch">

            Don't have an account?

            <a
                href="#"
                id="showRegister"
            >
                Register
            </a>

        </p>

    </div>

</div>
